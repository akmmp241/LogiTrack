global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway-service'
    static_configs:
      - targets: ['gateway-service:3000']

  - job_name: 'tracking-service'
    static_configs:
      - targets: ['tracking-service:3002']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3006']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']
    metrics_path: /metrics
