[workspace]
members = [
    "services/*",
    "libs/config",
    "libs/observability",
    "libs/use_case/biteship",
    "libs/errors",
    "libs/use_case/waha", "libs/use_case/payment",
]
resolver = "2"

#[build]
#rustflags = ["-Aunused"]

[workspace.dependencies]
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8" }
serde_json = "1.0"
uuid = { version = "1.19", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
sqlx = { version = "=0.8.5", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "json"] }
dotenvy = "0.15"
thiserror = "2.0"
anyhow = "1.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
async-trait = "0.1"
lapin = { version = "3.7" }
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"] }
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.6.8", features = ["trace", "cors"] }
argon2 = "0.5"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
rand = "0.9"
redis = { version = "1.0.5", features = ["tokio-comp", "aio"] }
deadpool-redis = "0.23.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22.1"
